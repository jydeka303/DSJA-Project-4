<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랫폼별 용도 구성</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
<style>
  :root{
    --bg:transparent; --panel:rgba(31,48,84,.55); --panel-line:rgba(255,255,255,.1);
    --ink:#ece7de; --ink-dim:#b8b1a4; --ink-faint:#7a7469;
    --accent:#D9A05B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}

  .use-matrix{max-width:1180px;margin:0 auto;padding:40px 24px 56px}
  .um-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .um-head h2{margin:0;font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .um-unit{font-size:13px;color:var(--ink-faint);font-weight:500}
  .um-head p{margin:14px 0 0;color:var(--ink-dim);font-size:15px;line-height:1.7;max-width:60ch;flex-basis:100%}

  /* ---- 스크롤 래퍼 (모바일에서 좌우 스크롤, 첫 열 고정) ---- */
  .um-scroll{position:relative;margin-top:30px;border:1px solid var(--panel-line);
             border-radius:14px;overflow-x:auto;background:transparent}
  table.um{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}

  .um th, .um td{padding:0;text-align:center}
  .um thead th{position:sticky;top:0;background:transparent;z-index:2;
               padding:16px 14px 13px;border-bottom:1px solid var(--panel-line)}
  .um thead th .pf{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .um thead th .n{display:block;margin-top:3px;font-size:11px;font-weight:500;
                  color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .um th.rowhead{position:sticky;left:0;z-index:3;background:transparent;
                 text-align:left;padding:13px 16px;font-size:13.5px;font-weight:600;
                 color:var(--ink);white-space:nowrap;border-right:1px solid var(--panel-line);
                 border-bottom:1px solid rgba(255,255,255,.04)}
  .um thead th.corner{left:0;z-index:4;border-right:1px solid var(--panel-line)}

  .um tbody tr:hover th.rowhead,.um tbody tr:hover td{background-color:color-mix(in srgb, var(--cellbg,transparent) 100%, white 6%)}
  .um tbody tr:last-child td, .um tbody tr:last-child th{border-bottom:none}

  .cell{position:relative;padding:10px 10px;border-bottom:1px solid rgba(255,255,255,.04);
        transition:filter .15s}
  .cell .pct{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
             letter-spacing:-.01em}
  .cell .cnt{display:block;margin-top:1px;font-size:10.5px;font-variant-numeric:tabular-nums;
             opacity:.72}
  .cell.zero .pct{opacity:.28;font-weight:500}
  .cell.zero .cnt{display:none}
  .cell.is-max::after{content:"";position:absolute;inset:3px;
                      border:1.6px solid var(--markc,var(--accent));
                      border-radius:6px;pointer-events:none;
                      box-shadow:0 0 0 1px var(--markhalo,transparent)}

  /* ---- 범례 ---- */
  .um-legend{display:flex;align-items:center;gap:12px;margin-top:16px;color:var(--ink-faint);font-size:12px}
  .um-legend>span{flex:0 0 auto;white-space:nowrap}
  .um-legend .lg{flex:1 1 auto;min-width:0;max-width:340px}
  .um-legend .bar{display:block;width:100%;height:7px;border-radius:99px}
  .um-legend .ticks{display:flex;justify-content:space-between;width:100%;margin-top:6px;
                    font-variant-numeric:tabular-nums}
  .um-legend .mark{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
  .um-legend .mark i{width:12px;height:12px;border:1.4px solid var(--accent);border-radius:3px;display:inline-block}

  .um-note{margin:14px 0 0;color:var(--ink-faint);font-size:12px;line-height:1.7}

  @media (max-width:640px){
    .um-legend{flex-wrap:wrap}
    .um-legend .mark{margin-left:0;flex-basis:100%}
  }
</style>
</head>
<body>
<section class="use-matrix">
  <header class="um-head">
    <h2>플랫폼별로 다른 용도 구성</h2>
    <span class="um-unit">단위: %</span>
    <p>위법확정 매물을 플랫폼별로 나눠, 어떤 건물 용도가 그 안에서 가장 큰 비중을 차지하는지<br> 비교했습니다. <strong>색이 밝을수록 해당 플랫폼 안에서 차지하는 비중이 큽니다.</strong></p>
  </header>

  <div class="um-scroll">
    <table class="um" id="table"></table>
  </div>

  <div class="um-legend">
    <span>적음</span>
    <div class="lg">
      <span class="bar" id="legendBar"></span>
      <div class="ticks"><span>0%</span><span id="tickMid"></span><span id="tickMax"></span></div>
    </div>
    <span>많음</span>
    <span class="mark"><i></i>해당 플랫폼 내 1위 용도</span>
  </div>

  <p class="um-note">괄호 안은 해당 플랫폼에 등록된 위법확정 매물 중 그 용도가 차지하는 비율입니다. 세로 합계가 100%를 넘을 수 있습니다.<br>※ 기타 6개 용도: 교육연구시설 4건 · 자동차관련시설 4건 · 판매시설 3건 · 종교시설 2건 · 창고시설 1건 · 근린생활시설 1건</p>
</section>

<script>
/* ══════════════════════════════════════════════════════════
   데이터 — 여기만 교체하면 됩니다
   ══════════════════════════════════════════════════════════ */
const PLATFORMS = [
  {key:"DB",  n:167},
  {key:"DG",  n:205},
  {key:"PTP", n:205},
  {key:"ZB",  n:116},
];

const ROWS = [
  {name:"업무시설",         v:[77,19,94,3]},
  {name:"단독주택",         v:[26,74,18,35]},
  {name:"공동주택",         v:[31,50,41,19]},
  {name:"제2종근린생활시설", v:[19,53,20,15]},
  {name:"공장",             v:[2,4,31,41]},
  {name:"제1종근린생활시설", v:[9,12,8,6]},
  {name:"숙박시설",         v:[7,3,4,3]},
  {name:"기타 6개 용도",    v:[3,4,6,2]},
];

/* 값(%)을 그대로 오버레이 불투명도로 사용: opacity = value/100 */
const BASE_RGB = [39,50,76];     // #27324C
const OVERLAY_RGB = [211,156,91]; // #D3985B
function ramp(p){
  const a = Math.max(0, Math.min(1, p/100));
  const c = BASE_RGB.map((b,k)=>Math.round(b + (OVERLAY_RGB[k]-b)*a));
  return [c, `rgba(${OVERLAY_RGB[0]},${OVERLAY_RGB[1]},${OVERLAY_RGB[2]},${a})`];
}

const pct = (v,n) => v / n * 100;
let MAXP = 0;
ROWS.forEach(r => r.v.forEach((v,i) => { MAXP = Math.max(MAXP, pct(v, PLATFORMS[i].n)); }));

/* 열별 최댓값(플랫폼 내 1위 용도) 표시용 */
const colMax = PLATFORMS.map((_,ci) => Math.max(...ROWS.map(r => r.v[ci])));

/* ── 테이블 렌더 ── */
const table = document.getElementById("table");
const thead = document.createElement("thead");
const trh = document.createElement("tr");
trh.innerHTML = `<th class="rowhead corner">용도</th>` +
  PLATFORMS.map(p => `<th><span class="pf">${p.key}</span><span class="n">n=${p.n}</span></th>`).join("");
thead.appendChild(trh);
table.appendChild(thead);

const tbody = document.createElement("tbody");
ROWS.forEach(r => {
  const tr = document.createElement("tr");
  const th = document.createElement("th");
  th.className = "rowhead";
  th.textContent = r.name;
  tr.appendChild(th);

  r.v.forEach((v, ci) => {
    const p = pct(v, PLATFORMS[ci].n);
    const [rgb, css] = ramp(p);
    const lum = (rgb[0]*299 + rgb[1]*587 + rgb[2]*114) / 1000;
    const td = document.createElement("td");
    td.className = "cell" + (v === 0 ? " zero" : "") + (v === colMax[ci] && v > 0 ? " is-max" : "");
    td.style.setProperty("--cellbg", css);
    td.style.background = css;
    const bright = lum > 150;
    td.style.color = bright ? "#172343" : "#ece7de";
    if (v === colMax[ci] && v > 0){
      td.style.setProperty("--markc",    bright ? "#172343" : "#D9A05B");
      td.style.setProperty("--markhalo", bright ? "rgba(255,255,255,.75)" : "rgba(10,17,32,.85)");
    }
    td.innerHTML = v === 0
      ? `<span class="pct">–</span>`
      : `<span class="pct">${p.toFixed(1)}%</span><span class="cnt">${v}건</span>`;
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
});
table.appendChild(tbody);

/* ── 범례 ── */
document.getElementById("legendBar").style.background =
  `linear-gradient(90deg, ${[0,20,40,60,80,100].map(a=>`rgba(${OVERLAY_RGB[0]},${OVERLAY_RGB[1]},${OVERLAY_RGB[2]},${a/100}) ${a}%`).join(",")})`;
document.getElementById("tickMid").textContent = (MAXP/2 |0 || (MAXP/2).toFixed(1)) + "%";
document.getElementById("tickMax").textContent = MAXP.toFixed(1) + "%";
</script>
</body>
</html>
